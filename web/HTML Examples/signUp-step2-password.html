<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
    <title>Welcome to kpi.com!</title>
    <link rel="shortcut icon" href="../WebContent/mainStyles/new-ui/login/img/favicon2.svg" type="image/svg">
    <link rel="stylesheet" href="../WebContent/mainStyles/new-ui/login/font-awesome/css/font-awesome.css">
    <link rel="stylesheet" href="../WebContent/mainStyles/new-ui/login/slick/slick.css">
    <link rel="stylesheet" href="../WebContent/mainStyles/new-ui/css/pass-validation.css">
    <link rel="stylesheet" href="../WebContent/mainStyles/new-ui/css/materialize.css">
    <script>
        var adPassEnabled = null;

        function checkForPassEnter(value) {
            console.log("======= here it comes =======")
            document.getElementById('error').style.display = 'none';
            if (value.length === 0) {
                document.getElementById('step1').innerHTML = '';
                // удаляем все классы, кроме "pass-validation"
                document.getElementById('passStrength').className = 'pass-validation';
                document.getElementById('step1').className = '';
            }
            if (value.length > 0) {
                if (adPassEnabled) {
                    code2word(passStrength(value, 15, 20, 1, 1, 1, 1, 11))
                } else {
                    code2word(passStrength(value, 8, 12, 1, 1, 1, 1, 4))
                }
            }
        }

        function checkForPassMatch(value) {
            passwordsMatch(document.getElementById('pass1').value, value) ? document.getElementById('error2').style.display = 'none' : "";
        }

        function submitnewPassword() {
            var error = 0;

            var passwordStrength = document.getElementById('step1').textContent;

            if (passwordStrength === 'Weak') {
                document.getElementById('error').style.display = '';
                document.getElementById('error').style.color = 'red';
                document.getElementById('error').innerHTML = "Password is weak or too short (Min. " + (adPassEnabled ? 15 : 8) + " characters and must contain at least one uppercase, " +
                    "lowercase letters, numbers, and special symbols such as $ % & ( @ # § = ')' , : ; - _ + ^ )";
                error++;
            }

            var passwordMatches = passwordsMatch(document.getElementById('pass1').value, document.getElementById('pass2').value);
            if (!passwordMatches) {
                document.getElementById('error').innerHTML = "Make sure that the password matches!";
                document.getElementById('error2').style.display = '';
                error++;
            }

            if (error === 0) {
                document.getElementById('formSubmit').submit();
            }
        }
    </script>
</head>
<body class="signUpStep signUpStep--2">
<div class="modal-holder active">
    <div class="modal modal--md sign-up-step sign-up-step--2" style="width: 823px; z-index: 1003; display: block; opacity: 1; transform: scaleX(1); top: 5%;">
        <div class="modal-wrapper">
            <div class="modal-header">
                <div class="hgroup">
                    <h1 class="fs-4">
                        <strong>Set Your Password</strong>
                    </h1>
                    <h2 class="sub-title fs-3">
                        Please enter a password for your account
                    </h2>
                </div>
            </div>
            <form action="/auth/changePassword.html" method="post" id="formSubmit">
                <input type="hidden" name="checkUser" value="true">
                <input type="hidden" name="adPassEnabled" value="">

                <div class="modal-content">
                    <div class="sign-up-step__password">
                        <div class="form-group">
                            <div class="form-group__label">
                                Password
                            </div>
                            <div class="form-group__content">
                                <input placeholder="Password" type="password" class="form-control" name="password" id="pass1" onkeyup="checkForPassEnter(this.value)">
                                <div id="passStrength" class="pass-validation">
                                    <div class="pass-validation__view pass-validation__view--mod">
                                        <span class="pass-validation__view__step-1"></span>
                                        <span class="pass-validation__view__step-2"></span>
                                        <span class="pass-validation__view__step-3"></span>
                                    </div>
                                    <div class="pass-validation__text">
                                        <span id="step1"></span>
                                    </div>
                                </div>
                            </div>
                            <span id="error" style="color:red;"></span>
                        </div>

                        <div class="form-group">
                            <div class="form-group__label">
                                Confirm Your Password
                            </div>
                            <div class="form-group__content">
                                <input type="password" class="form-control" placeholder="Confirm Your Password" name="cPassword" id="pass2" value="" onkeyup="checkForPassMatch(this.value)">
                            </div>
                            <span id="error2" style="display:none; color: red;">&nbsp;Passwords should match</span>
                        </div>
                        <input type="hidden" id="strength" name="strength" value="">
                        <button type="button" class="btn btn--primary" onclick="submitnewPassword()">Continue</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="lean-overlay file--changePassword" id="materialize-lean-overlay-1" style="z-index: 1002; display: block; opacity: 0.5;"></div>
</div>

<script type="text/javascript">
    function code2word(code) {
        document.querySelector('#strength').value = code;
        console.log(code);
        if (code === 'WEAK') {
            document.getElementById('step1').innerHTML = 'Weak';
        }
        if (code === 'MEDIUM') {
            document.getElementById('step1').innerHTML = 'Medium';
        }
        if (code === 'STRONG') {
            document.getElementById('step1').innerHTML = 'Strong';
        }
        // удаляем все классы, кроме "pass-validation"
        document.getElementById('passStrength').className = 'pass-validation';
        document.getElementById('step1').className = '';
        // добавляем класс в зависимости от силы пароля
        switch (code) {
            case 'WEAK':
                document.getElementById('passStrength').classList.add('pass-validation--state-1');
                document.getElementById('step1').classList.add('pass-validation__text__step-1');
                break;
            case 'MEDIUM':
                document.getElementById('passStrength').classList.add('pass-validation--state-2');
                document.getElementById('step1').classList.add('pass-validation__text__step-2');
                break;
            case 'STRONG':
                document.getElementById('passStrength').classList.add('pass-validation--state-3');
                document.getElementById('step1').classList.add('pass-validation__text__step-3');
                break;
            default:
            // если code не равен ни одному из этих значений, ничего не делаем
        }
    }
</script>
