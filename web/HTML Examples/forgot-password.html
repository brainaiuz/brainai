<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
    <title>Welcome to kpi.com!</title>
    <link rel="shortcut icon" href="../WebContent/mainStyles/new-ui/login/img/favicon2.svg" type="image/svg">
    <link rel="stylesheet" href="../WebContent/mainStyles/new-ui/login/font-awesome/css/font-awesome.css">
    <link rel="stylesheet" href="../WebContent/mainStyles/new-ui/login/slick/slick.css">
    <link rel="stylesheet" href="../WebContent/mainStyles/new-ui/css/pass-validation.css">
    <link rel="stylesheet" href="../WebContent/mainStyles/new-ui/login/css/main.css">

</head>
<body>

<div class="pg_landing">
    <div class="pg_landing__container">
        <figure class="pg_landing__header">
            <div class="pg_landing__logo">
                <a href="#">
                    <img src="../../mainStyles/new-ui/images/new-kpi-logo2.svg" alt="logo">
                </a>
            </div>
            <figcaption>Manage your business from <br> a single platform.</figcaption>
        </figure>
        <div class="pg_landing__main">
            <div class="pg_landing__main-innerbox">
                <div class="cp_login cp_login--step-2">
                    <div class="cp_login__content">
                        <div class="cp_login__title">
                            Password Recovery
                        </div>
                        <div class="cp_login__main">
                            <div class="cp_login__subtitle">
                                Enter your email address in the space below and we will mail you the password reset instructions.
                            </div>
                            <form action="/auth/forgotPassword.html" method="post">

                                <div class="cp_login__field">
                                    <input id="login" name="email" type="text" placeholder="Email">
                                    <div class="cp_login__field-underline"></div>
                                </div>
                                <div class="cp_login__form-item">
                                    <input class="cp_login__submit elm_btn" type="submit" value="Send">
                                </div>
                                <div class="cp_login__pass-forgot">
                                    <a href="/mainLogin" class="elm_btn--back">
                                        <svg>
                                            <use xlink:href="../WebContent/mainStyles/new-ui/icons/spriteSignup.svg#ico-chevron-left"></use>
                                        </svg>
                                        <span>Back to Login </span>
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="pg_landing-bg">

</div>
</body>
</html>
