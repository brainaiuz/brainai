<script>
    let iti = null;

    // --- Main Logic ---
    document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("signUpFree");
        const phoneInput = document.getElementById("signUpFree_phone");
        if (!form || !phoneInput) return;

        // Initialize the phone input library
        iti = window.intlTelInput(phoneInput, {
            initialCountry: document.body.getAttribute('data-initial-country') || 'us',
            // This setup enables auto-formatting.
            separateDialCode: false
        });

        try {
            document.getElementById('external_url').value = btoa(document.referrer);
            document.getElementById('company_signed_up_from').value = window.location.href;
        } catch (e) { /* silent fail */
        }

        form.addEventListener("submit", validateAndSubmit);
    });

    async function validateAndSubmit(event) {
        event.preventDefault();

        // --- Client-side validation ---
        // Сброс предыдущих ошибок
        document.getElementById('formErrorMessage').style.display = 'none';

        // phone validation
        const phoneInput = document.getElementById("signUpFree_phone");
        if (!iti.isValidNumber()) {
            showError("Please enter a valid phone number.");
            return;
        }

        // --- MODIFIED: Conditional reCAPTCHA validation ---
        const activeProfile = document.body.getAttribute('data-active-profile');
        // We only validate reCAPTCHA if the profile is NOT local and NOT staging
        if (activeProfile && activeProfile !== "local" && activeProfile !== "staging") {
            if (typeof grecaptcha !== 'undefined' && grecaptcha.getResponse().length === 0) {
                showError("Please complete the reCAPTCHA.");
                return;
            }
        }

        // --- Show progress panel ---
        initializeProgressPanel();
        animateProgressPanel();

        // Prepare FormData for submission
        const formData = new FormData(document.getElementById("signUpFree"));

        // Set phone number and country data
        formData.set('phone', iti.getNumber());
        formData.set('countryCode', iti.getSelectedCountryData().iso2.toUpperCase());
        formData.set('callCode', "+" + iti.getSelectedCountryData().dialCode);

        try {
            // --- Send data ---
            const response = await fetch('/auth/signup.html', {
                method: 'POST',
                body: new URLSearchParams(formData)
                // headers: {
                //     'Accept': 'application/json',
                //     'Content-Type': 'application/x-www-form-urlencoded'
                // }
            });

            // --- IMPROVED: Error and success handling ---
            if (!response.ok) {
                // If the response is not OK (e.g., 400, 409, 500), try to parse it as JSON
                try {
                    const errorData = await response.json();
                    // If we get a redirectUrl (for existing user), we redirect
                    if (errorData.redirectUrl) {
                        window.location.href = errorData.redirectUrl;
                    } else {
                        // Otherwise, show the error message from the server
                        showError(errorData.message || `Server error: `);
                    }
                } catch (e) {
                    // This catch block handles cases where the response is not valid JSON (like a 500 error page)
                    showError(`An unexpected server error occurred (Status: ). Please try again later.`);
                }
                removeProgressPanel();
            } else {
                // Success! (Status 200 OK)
                setTimeout(() => {
                    window.location.href = '/welcomePage.html';
                }, 1500);
            }

        } catch (error) {
            // This catch block handles network errors (e.g., server is down)
            console.error("Network or fetch error:", error);
            showError("A network error occurred. Please check your connection and try again.");
            removeProgressPanel();
        }
    }

    function showError(message) {
        const errorElement = document.getElementById('formErrorMessage');
        errorElement.innerText = message;
        errorElement.style.display = 'block';
    }
</script>
