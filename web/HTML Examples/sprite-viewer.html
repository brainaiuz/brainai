<script>
// Функция для вставки иконок из SVG-спрайта в тело документа
function insertIcons() {
    // Получаем элемент <svg> с нашим спрайтом
    const svgElements = document.getElementsByTagName("svg");
    const sprite = svgElements[0];
    // Получаем все элементы <symbol> в нашем спрайте
    const symbols = sprite.querySelectorAll("symbol");
    // Для каждого символа выполняем следующее
    symbols.forEach((symbol) => {
        // Получаем все элементы <path> в нашем символе
        var path = symbol.querySelectorAll("path");
        // Для каждого элемента <path> выполняем следующее
        path.forEach((p) => {
            // Удаляем атрибут fill, если он есть
            p.removeAttribute("fill");
            // Добавляем атрибут fill со значением currentColor, чтобы иконка заполнялась цветом, который мы укажем в CSS
            p.setAttribute("fill", "currentColor");
        });
        // Вставляем SVG-элемент с ссылкой на наш символ в тело документа
        document.body.insertAdjacentHTML(
            "beforeend",
            `
    <svg width="50" height="50">
        <title>#${symbol.id}</title>
        <use xlink:href="#${symbol.id}" />
    </svg>
    `
        );
    });
}

// Вызываем функцию для вставки иконок из SVG-спрайта в тело документа
insertIcons();
</script>
