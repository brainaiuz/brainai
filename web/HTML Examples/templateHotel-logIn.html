                    <div class="control-group">
                        <input type="password" id="password" class="form-control">
                    </div>
                    <div class="error-message">Wrong password</div>
                </div>

                <button type="submit" class="btn btn-primary">Log in</button>

                <div class="form-group forgot-pass">
                    <a href="#">Forgot your password?</a>
                </div>
            </form>
        </div>
    </div>
</div>


<script>
    // Initialization when the page loads
    document.addEventListener('DOMContentLoaded', () => {
        const passwordToggle = document.querySelector('.password__view');
        const passwordInput = document.querySelector('#password');

        passwordToggle.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            passwordToggle.classList.toggle('active');
            passwordToggle.querySelector('span').textContent = isPassword ? 'Show' : 'Hide';
        });
    });
</script>
