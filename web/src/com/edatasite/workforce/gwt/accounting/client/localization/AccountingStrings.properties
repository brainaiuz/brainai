box1=Box 1
box10Description=Total value of supplies in expenses, VAT that is to be recovered based on them, and any adjustments made to those values. This box will be auto-populated based on Box 8 and 9.
box11Description=Total value of the output tax calculated based on the sum of the VAT and adjustments columns in the outputs section.
box11Title=Total value of due tax for the period
box12Description=Total value of the recoverable input tax calculated based on the sum of the VAT and adjustments columns in the inputs section.
box12Title=Total value of recoverable tax for the period
box13Description=Net tax recoverable or payable for the current tax period. If the amount in Box 11 is greater than the amount in Box 12, you must pay the difference of these amounts. If it is lesser, you will be eligible to request a refund for the net amount of recoverable tax.
box13Title=Net VAT payable (or reclaimable) for the period
box14Description=If you are eligible for a VAT refund, you can claim this refund in the current reporting period based on the total recoverable tax provided in the box above.
box14Title=Do you wish to request a refund for the above amount of reclaimable VAT?
box1aDescription=Total value of all standard rated goods and services (exclusive of VAT) sold in the Abu Dhabi in the current reporting period, and the VAT that was collected on their sale or adjustments to similar sales made in the previous reporting periods.
box1aTitle=Standard rated supplies in Abu Dhabi
box1bDescription=Total value of all standard rated goods and services (exclusive of VAT) sold in the Dubai in the current reporting period, and the VAT that was collected on their sale or adjustments to similar sales made in the previous reporting periods.
box1bTitle=Standard rated supplies in Dubai
box1cDescription=Total value of all standard rated goods and services (exclusive of VAT) sold in the Sharjah in the current reporting period, and the VAT that was collected on their sale or adjustments to similar sales made in the previous reporting periods.
box1cTitle=Standard rated supplies in Sharjah
box1dDescription=Total value of all standard rated goods and services (exclusive of VAT) sold in the Ajman in the current reporting period, and the VAT that was collected on their sale or adjustments to similar sales made in the previous reporting periods.
box1dTitle=Standard rated supplies in Ajman
box1eDescription=Total value of all standard rated goods and services (exclusive of VAT) sold in the Umm Al Quwain in the current reporting period, and the VAT that was collected on their sale or adjustments to similar sales made in the previous reporting periods.
box1eTitle=Standard rated supplies in Umm Al Quwain
box1fDescription=Total value of all standard rated goods and services (exclusive of VAT) sold in the Ras Al Khaimah in the current reporting period, and the VAT that was collected on their sale or adjustments to similar sales made in the previous reporting periods.
box1fTitle=Standard rated supplies in Ras Al Khaimah
box1gDescription=Total value of all standard rated goods and services (exclusive of VAT) sold in the Fujairah in the current reporting period, and the VAT that was collected on their sale or adjustments to similar sales made in the previous reporting periods.
box1gTitle=Standard rated supplies in Fujairah
box2=Box 2
box2Description=Total value of services (exclusive of VAT) that were purchased, imported and have reverse charged applied on them, and VAT that was collected on their purchase or adjustments to similar purchases made in the previous reporting periods. Goods, whose movement were not declared in the UAE customs (for any reason) should also be reported in this box.
box2Title=Supplies subject to the reverse charge provisions
box3=Box 3
box3Description=Total value of all zero-rated goods and services sold within the UAE in the current reporting period.
box3Title=Zero rated supplies
box4=Box 4
box4Description=Total value of all exempted goods and services sold in the UAE in the current reporting period.
box4Title=Exempt supplies
box5=Box 5
box5Description=Total value of goods purchased and imported into the UAE (exclusive of VAT), and the output VAT that was declared and collected on their purchase at the UAE customs. This box will be auto-populated based on the imports you have declared under your Customs Registration Number, which would be linked to your TRN.
box5Title=Goods imported into the UAE
box6=Box 6
box6Description=Use this box to make adjustments in case of any discrepancy in the pre-populated VAT or the total amount in Box 5. The amounts in this box can be positive or negative, and should be justifiable if enquired by the FTA.
box6Title=Adjustments and additions to goods imported into the UAE
box7=Box 7
box7Description=Total amount calculated based on all the boxes above, the total output tax due to the FTA, and the total adjustments applicable to that value for the tax period.
box8=Box 8
box8Description=Total value of standard rated goods and services purchased (exclusive of VAT) in the UAE, the net VAT recoverable on their purchases, and adjustments to similar purchases made in the previous reporting periods.
box8Title=Standard rated expenses
box9=Box 9
box9Description=Total value of supplies (exclusive of VAT) that were subject to the reverse charge mechanism declared in Boxes 2, 5 and 6, and the VAT that should be recovered on their supply.
box9Title=Supplies subject to the reverse charge provisions
