_WORKFLOW_EXECUTION_CRITERIA_CREATE=CREATE(Executes the rule when record(s) is/are created)
_WORKFLOW_EXECUTION_CRITERIA_EDIT=EDIT(Executes the rule when record(s) is/are modified)
_WORKFLOW_EXECUTION_CRITERIA_CREATE_EDIT=CREATE or EDIT(Executes the rule when record(s) is/are created or modified)
_WORKFLOW_EXECUTION_CRITERIA_REMOVE=REMOVE(Executes the rule when record(s) is/are deleted)
_WORKFLOW_EXECUTION_CRITERIA_UPDATE_SPECIFIED_FIELD=UPDATE SPECIFIED FIELD(Executes the rule when the value of record's specified field changed)
_WORKFLOW_EXECUTION_CRITERIA_RECURRENCE=Recurrence
_WORKFLOW_ACTION_APPROVING=APPROVE or REJECT(Executes the rule when record(s) is/are approved or rejected)
