refreshBrowser =<h6>Dear Valued Client,</h6>\
  <p>We are currently upgrading our system to provide you with an enhanced experience. As part of this upgrade, it's important to clear your browser's cache. You can do this using either of the following methods:</p> \
  <h5>Method 1: Using Keyboard Shortcut (Ctrl + F5)</h5> \
  <ol>\
  <li>Hold down the Ctrl key on your keyboard.</li>\
  <li>While holding down Ctrl, press the F5 key.</li>\
  </ol>\
  <p>This will force your browser to reload the page and clear any cached data.</p>\
  <h5>Method 2: Using Browser Settings</h5>\
  <ol>\
  <li>Click on the menu icon (three dots or lines) in the top-right corner of your browser window.</li>\
  <li>Select "Settings" from the drop-down menu.</li>\
  <li>Navigate to "Privacy and security" settings.</li>\
  <li>Click on "Clear browsing data."</li>\
  <li>Ensure that "Cached images and files" is checked.</li>\
  <li>Click "Clear data" to proceed.</li>\
  </ol>\
  <p>This will refresh your browser and ensure you're using the latest version of our system.</p>\
  <p>Thank you for your cooperation.</p>
