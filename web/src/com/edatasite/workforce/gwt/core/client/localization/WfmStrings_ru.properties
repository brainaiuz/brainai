refreshBrowser=<h6>Уважаемый клиенты!</h6>\
  <p>В настоящее время мы модернизируем нашу систему, чтобы предоставить вам улучшенный опыт. В рамках этого обновления важно очистить кэш вашего браузера. Это можно сделать одним из следующих способов:</p>\
  <h5>Метод 1: Использование сочетания клавиш (Ctrl + F5)</h5>\
  <ol>\
  <li>Удерживайте клавишу Ctrl на вашей клавиатуре.</li>\
  <li>Удерживая Ctrl, нажмите клавишу F5.</li>\
  </ol>\
  <p>Это заставит ваш браузер перезагрузить страницу и очистить любые кэшированные данные.</p>\
  <h5>Метод 2: Использование настроек браузера</h5>\
  <ol>\
  <li>Нажмите на значок меню (три точки или линии) в верхнем правом углу окна браузера.</li>\
  <li>Выберите "Настройки" в выпадающем меню.</li>\
  <li>Перейдите в настройки "Конфиденциальность и безопасность".</li>\
  <li>Нажмите "Очистить данные просмотра".</li>\
  <li>Убедитесь, что выбран пункт "Кэшированные изображения и файлы".</li>\
  <li>Нажмите "Очистить данные", чтобы продолжить.</li>\
  </ol>\
  <p>Это обновит ваш браузер и гарантирует, что вы используете последнюю версию нашей системы.</p>\
  <p>Спасибо за ваше сотрудничество.</p>\
