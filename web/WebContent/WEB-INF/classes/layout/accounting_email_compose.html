<div class="content-box content-box--white compose">
    <div class="width-limiter">
        <div class="form-row align-items-end">
            <div class="col-6">
                $$input:FROM$$
            </div>
            <div class="col-6">
                $$input:CONTACT$$
            </div>
        </div>

        <div class="">
            $$input:TO$$
        </div>

        <div class="form-row">
            <div class="col-12">
                $$input:CC$$
            </div>
        </div>

        <div class="form-row">
            <div class="col-12">
                $$input:BCC$$
            </div>
        </div>

        <div class="form-row compose__subject">
            <div class="col">
                <div class="grid-row no-gutters align-items-end">
                    <div class="col">
                        $$input:SUBJECT$$
                    </div>
                    <div class="col-auto">
                        $$input:TEMPLATE$$
                    </div>
                </div>
            </div>
            <div class="col-auto">
                $$input:PDF_TEMPLATE$$
            </div>

        </div>

        <div class="form-group code row">
            $$input:EDITOR$$
        </div>
        <!--<div class="form-row">
            <div class="col-12">
                $$input:SEND_COPY$$
            </div>
        </div>-->
    </div>
</div>
