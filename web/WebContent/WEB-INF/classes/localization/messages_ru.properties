main.accountsNote=Приложение бухгалтерского учета разработано, чтобы держать ваши финансы в порядке.\
Управляйте счет фактурами, заказами, складской учёт, расходами, автоматизируйте платежи и многое другое. \
Это идеально подходит для бизнеса в разных отраслях. Переключитесь на умный учет и будьте на вершине своих финансов.
main.salesNote=Повысьте свои продажи с помощью простой, но мощной CRM, которая адаптируется к вашим потребностям. Управляйте своими лидами, возможностями с помощью персонализированных воронок продаж и получайте доступ к любой информации о клиентах в любое время.
main.humansNote=Управляйте всем своим отделом кадров с меньшими хлопотами и бумажной работой. Управление процессом найма, адаптации, записей сотрудников в одном месте. Следите за всеми деталями, связанными с личными данными, документами, датами истечения срока документов, оповещениями и многим другим.
main.projectsNote=Возьмите под контроль свои проекты в режиме реального времени и максимизируйте их прибыльность. Назначьте обязанности каждому соответствующему члену команды, чтобы четко увидеть анализ затрат времени, потраченного на каждый проект.
main.payrollNote=Платежная ведомость или управление зароботной платой, идеально подходит для администраторов, которые хотят удобно синхронизировать ее с другими приложениями. Такими как с системой управления отпусками, посещаемостью и сверхурочными которые хранятся в профиле сотрудника в модулях HR и PM, а автоматические записи о зарплате создаются в разделе «Бухгалтерский учет».
