main.accountsNote=Hisoblar ilovasi buxgalteriya kitobingiz va moliyaviy ma'lumotlaringizni tartibli saqlash uchun mo'ljallangan. Invoyslar, buyurtmalar, inventarlar va xarajatlarni boshqaring, to'lovlar va boshqalarni avtomatlashtiring. Aqlli buxgalteriyaga o'ting va raqamlar ustidan to'liq nazoratni qo'lga oling.
main.salesNote=Ehtiyojlaringizga mos keladigan sodda, ammo kuchli MMB yordamida savdo hajmini oshiring. Moslashtirilgan savdo dudbo'ronlari yordamida ehtimoliy mijoz va imkoniyatlarni boshqaring, shuningdek istalgan mijoz ma'lumotlariga istalgan vaqtda kirish imkoniga ega bo'ling.
main.humansNote=Kadrlar bo'limingizni (KB) qiyinchiliklarsiz va ortiqcha qog'ozbozliklarsiz yuriting. Ishga qabul qilish va adaptatsiya jarayonlarini, shuningdek ish unumdorligi va xodim qaydlarini bir joyda boshqaring. Shaxsiy ma'lumotlar, hujjatlar, amal qilish muddatlari, ogohlantirishlar va boshqalarga aloqador barcha tafsilotlarni kuzatib boring.
main.projectsNote=Loyihalaringizni real vaqtda nazorat qiling va ularning rentabelligini oshiring. Har bir loyihaga sarflangan vaqt xarajatlari tahlilini aniq ko'rish uchun barcha aloqador jamoa a'zolariga vazifalarni tayinlang.
main.payrollNote=Ish haqi moduli uni boshqa ilovalar bilan qulay bir shaklda sinxronlashtirmoqchi bo'lgan ma'murlar uchun juda mos keladi. Izn, davomat va qo'shimcha soatlar haqidagi xodim ma'lumotlari KB va LM modullarida xodim profili ostida saqlanadi. Buxgalteriya hisobi seksiyasida esa avtomatlashtirilgan ish haqi qaydlari yaratiladi.
main.kpicomoffers=kpi.com bitta login bilan foydalanishingiz mumkin bo'lgan 50 dan ortiq integratsiyalashgan xususiyatlar to'plamini taqdim etadi.  Jamoalar platformada samaradorlikni oshirish uchun xodimlar, mijozlar, hisoblar, loyihalar va boshqalarni boshqarishda birgalikda ishlashlari mumkin. Alohida ajratilgan ilovalar kanali rivojlanayotgan kompaniyalar uchun aynan mos taklif hisoblanadi.
