<div class="section-box box-bg--1">
    <div class="contentBar tool-invoice c-block">
        <div class="contentScroll">
            <div class="bindContent" cellpadding="0" cellspacing="0">
                <div>
                    <div>
                        <div class="mainBar">
                            <div class="group-box group-box--united">
                                <div class="group-box__items">

                                    <div class="group-box__item">
                                        <div class="group-box__item-label">
                                            $$label:name$$
                                        </div>
                                        <div class="group-box__item-content">
                                            $$input:name$$
                                        </div>
                                    </div>

                                    <div class="group-box__item">
                                        <div class="group-box__item-label">
                                            $$label:date$$
                                        </div>
                                        <div class="group-box__item-content">
                                            $$input:date$$
                                        </div>
                                    </div>

                                    <div class="group-box__item">
                                        <div class="group-box__item-label">
                                            $$label:reference$$
                                        </div>
                                        <div class="group-box__item-content">
                                            $$input:reference$$
                                        </div>
                                    </div>

                                    <div class="group-box__item group-box__item--width-free">
                                        <div class="group-box__item-label">
                                            $$label:number$$
                                        </div>
                                        <div class="group-box__item-content">
                                            $$input:number$$
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="sect">
                                $$input:itemtable$$
                            </div>

                        </div>
                    </div>
                    <!-- End  col -->
                    <div class="sidebar">
                        <div class="inv-OptBar">
                            <div class="optBarBlock invoice-attachments">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
