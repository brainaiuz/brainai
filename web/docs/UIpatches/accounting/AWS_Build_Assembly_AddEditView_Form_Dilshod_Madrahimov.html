<div class="contentBar tool-invoice c-block">
    <div class="contentScroll">
        <table class="bindContent" cellpadding="0" cellspacing="0">
            <tbody>
            <tr>
                <td class="mainBar">
                    <div class="invoice-block">
                        <div class="sect clear group" style="margin-bottom: 20px">
                            <div class="invoice-title">
                                $$label:title$$
                            </div>
                        </div>
                        <div class="sect group">
                            <div class="lineItem">
                                $$label:date$$
                                $$input:date$$
                            </div>
                            <div class="lineItem">
                                $$label:productname$$
                                $$input:productname$$
                            </div>
                            <div class="lineItem">
                                $$label:itemqty$$
                                $$input:itemqty$$
                            </div>
                            <div class="lineItem">
                                $$label:warehouse$$
                                $$input:warehouse$$
                            </div>
                        </div>
                        <div class="sect">
                            $$input:itemtable$$
                        </div>

                        <div class="invoice-btns-row sect clear" style="text-align:center !important">
                            <div class="invoice-btn-save">
                                $$input:saveButton$$
                            </div>
                            <div class="invoice-btn-save">
                                $$input:closeButton$$
                            </div>
                        </div>
                    </div>
                </td>
                <!-- End  col -->
            </tr>
            </tbody>
        </table>
    </div>
</div>
