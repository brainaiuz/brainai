<div class="contentBar" style="padding:0 10px;">
    <style>
        .reachFullWidth table {
            border: none !important;
        }
    </style>

    <div id="click1" class="slideDown-box expand group">
        <h3 onclick="var myclick=document.getElementById('click1');if(myclick &amp;&amp; myclick.className);{var cls=myclick.className;if(cls.indexOf('expand')>=0){cls=cls.replace('expand','');}else{cls+=' expand';}myclick.className=cls;}" class="slideDown-title">$$label:INVOICE_DETAILS$$</h3>

        <fieldset class="slideDown-content group labelLine">
            <div class="halfSet-1 left">
                <div class="row">
                    <div class="field">
                        $$input:MAIN_TABLE_PANEL$$
                    </div>
                </div>

                <div class="row">
                    <div class="field">
                        $$input:TOTAL_TABLE_PANEL$$
                    </div>
                </div>
                <div class="row">
                    <div class="field">
                        $$input:PAYMENT_TABLE$$
                    </div>
                </div>
                <div class="row">
                    <div class="field">
                        $$input:CUSTOM_HTML_TEMPLATE$$
                    </div>
                </div>
            </div>
        </fieldset>
    </div>
</div>
