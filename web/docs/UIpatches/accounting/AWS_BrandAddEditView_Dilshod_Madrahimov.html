<div class="contentBar" style="padding:0 10px;">
    <style>
        .reachFullWidth table {
            border: none !important;
        }
    </style>

    <div id="click1" class="slideDown-box expand group">
        <h3 onclick="var myclick=document.getElementById('click1');if(myclick &amp;&amp; myclick.className);{var cls=myclick.className;if(cls.indexOf('expand')>=0){cls=cls.replace('expand','');}else{cls+=' expand';}myclick.className=cls;}"
            class="slideDown-title">$$label:TITLE$$</h3>

        <fieldset class="slideDown-content group labelLine">
            <div class="halfSet-1 left">
                <div class="row">
                    $$label:NAME$$
                    <div class="field">
                        $$input:NAME$$
                    </div>
                </div>
                <div class="row">
                    $$label:DESCRIPTION$$
                    <div class="field">
                        $$input:DESCRIPTION$$
                    </div>
                </div>
                <div class="row">
                    $$label:PARENT$$
                    <div class="field">
                        $$input:PARENT$$
                    </div>
                </div>
                <div class="row">
                    $$label:IMAGE_PANEL$$
                    <div class="field">
                        $$input:IMAGE_PANEL$$
                    </div>
                </div>
            </div>

        </fieldset>

    </div>

</div>
