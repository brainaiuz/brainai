<!--SLA_FORM-->
<div class="contentBar" style="padding:0 10px;">
    <div id="click1" class="slideDown-box expand group">
        <h3 onclick="var myclick=document.getElementById('click1');if(myclick &amp;&amp; myclick.className);{var cls=myclick.className;if(cls.indexOf('expand')>=0){cls=cls.replace('expand','');}else{cls+=' expand';}myclick.className=cls;}" class="slideDown-title">$$label:SLA$$</h3>

        <fieldset class="slideDown-content group labelLine">
            <div class="halfSet-1 left">
                <div class="row">$$label:NAME$$<div class="field">$$input:NAME$$</div></div>
                <div class="row">$$label:PRIORITY$$<div class="field">$$input:PRIORITY$$</div></div>
                <div class="row">$$label:TYPE$$<div class="field">$$input:TYPE$$</div></div>
                <div class="row">$$label:CASE_REASON$$<div class="field">$$input:CASE_REASON$$</div></div>
                <div class="row">$$label:RESPONSE_TIME$$<div class="field">$$input:RESPONSE_TIME$$</div></div>
            </div>
        </fieldset>

    </div>
</div>
