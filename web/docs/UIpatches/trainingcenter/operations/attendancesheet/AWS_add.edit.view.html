<div class="contentBar" style="padding:0 10px;padding-top:3px;">
    <div id="click1" class="slideDown-box  group expand">
        <fieldset class="slideDown-content group labelLine">
            <div class="halfSet-1 left">

                <div class="row">
                    $$label:LOCATION$$
                    <div class="field">
                        $$input:LOCATION$$
                    </div>
                </div>

                <div class="row">
                    $$label:DATE$$
                    <div class="field">
                        $$input:DATE$$
                    </div>
                </div>

                <div class="row">
                    $$label:INSTRUCTOR$$
                    <div class="field">
                        $$input:INSTRUCTOR$$
                    </div>
                </div>

                <div class="row">
                    $$label:COURSE$$
                    <div class="field">
                        $$input:COURSE$$
                    </div>
                </div>
            </div>

        </fieldset>
    </div>

    <div id="click2" class="slideDown-box  group expand">
        <fieldset class="slideDown-content group labelLine">
            <div class="halfSet-1 left">

                <div class="row">
                    $$label:INSTRUCTOR_ATTENDENCE$$
                    <div class="field" style="border:1px solid #96c0e6">
                        $$input:INSTRUCTOR_ATTENDENCE$$
                    </div>
                </div>
            </div>

        </fieldset>
    </div>

    <div id="click3" class="slideDown-box  group expand">
        <fieldset class="slideDown-content group labelLine">
            <div class="halfSet-1 left">

                <div class="row">
                    $$label:STUDENTS_ATTENDENCE$$
                    <div class="field" style="border:1px solid #96c0e6">
                        $$input:STUDENTS_ATTENDENCE$$
                    </div>
                </div>
            </div>
        </fieldset>

    </div>

</div>
