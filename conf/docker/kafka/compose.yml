
services:
  kafka-1:
    image: "${KPI_KAFKA_IMAGE}"
    container_name: "${KPI_KAFKA_HOST_1}"
    hostname: "${KPI_KAFKA_HOST_1}"
    ports:
      - "${KPI_KAFKA_PORT_1}:${KPI_KAFKA_PORT_1}"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_KRAFT_CLUSTER_ID: "${KPI_KAFKA_CLUSTER_ID}"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@${KPI_KAFKA_HOST_1}:9091,2@${KPI_KAFKA_HOST_2}:9091,3@${KPI_KAFKA_HOST_3}:9091"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9092"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-1:9090,EXTERNAL://${KPI_KAFKA_EXTERNAL_HOST}:${KPI_KAFKA_PORT_1}"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
    restart: unless-stopped

  kafka-2:
    image: "${KPI_KAFKA_IMAGE}"
    container_name: "${KPI_KAFKA_HOST_2}"
    hostname: "${KPI_KAFKA_HOST_2}"
    ports:
      - "${KPI_KAFKA_PORT_2}:${KPI_KAFKA_PORT_2}"
    environment:
      KAFKA_CFG_NODE_ID: "2"
      KAFKA_KRAFT_CLUSTER_ID: "${KPI_KAFKA_CLUSTER_ID}"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@${KPI_KAFKA_HOST_1}:9091,2@${KPI_KAFKA_HOST_2}:9091,3@${KPI_KAFKA_HOST_3}:9091"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:${KPI_KAFKA_PORT_2}"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-2:9090,EXTERNAL://${KPI_KAFKA_EXTERNAL_HOST}:${KPI_KAFKA_PORT_2}"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
    restart: unless-stopped

  kafka-3:
    image: "${KPI_KAFKA_IMAGE}"
    container_name: "${KPI_KAFKA_HOST_3}"
    hostname: "${KPI_KAFKA_HOST_3}"
    ports:
      - "${KPI_KAFKA_PORT_3}:${KPI_KAFKA_PORT_3}"
    environment:
      KAFKA_CFG_NODE_ID: "3"
      KAFKA_KRAFT_CLUSTER_ID: "${KPI_KAFKA_CLUSTER_ID}"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@${KPI_KAFKA_HOST_1}:9091,2@${KPI_KAFKA_HOST_2}:9091,3@${KPI_KAFKA_HOST_3}:9091"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:${KPI_KAFKA_PORT_3}"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-3:9090,EXTERNAL://${KPI_KAFKA_EXTERNAL_HOST}:${KPI_KAFKA_PORT_3}"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
    restart: unless-stopped