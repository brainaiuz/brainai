[databases]
multischemapaid = host=pgsql.kpi.internal port=5432
multischemapaid1 = host=pgsql.kpi.internal port=5432
multischemafree = host=pgsql.kpi.internal port=5432
globalauth = host=pgsql.kpi.internal port=5432
logaudit = host=pgsql.kpi.internal port=5432
reportingservice_excel = host=pgsql.kpi.internal port=5432
qrtzdb = host=pgsql.kpi.internal port=5432 pool_mode=session

* = host=pgsql.kpi.internal port=5432 pool_mode=transaction


[pgbouncer]

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; Network settings
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

listen_addr = 0.0.0.0
listen_port = 6432

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; Authentication settings
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

auth_file = /etc/pgbouncer/userlist.txt
auth_type = scram-sha-256
auth_user = pgbouncer
auth_query = SELECT * FROM public.user_lookup($1)

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; Pool settings
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

max_client_conn = 2000
default_pool_size = 20
reserve_pool_size = 10

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; Connection reset / compatibility
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; Admin / stats
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; admin user is kpi and password is KP!P@SSWD
admin_users = kpi
stats_users = kpi

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; Logging
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

log_connections = 0
log_disconnections = 0

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; Timeouts
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

server_lifetime = 1200

server_idle_timeout = 1200

server_connect_timeout = 30

server_login_retry = 10

client_login_timeout = 120

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; TCP settings
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

tcp_keepalive = 1